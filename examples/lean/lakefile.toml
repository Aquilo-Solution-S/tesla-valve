name = "shop"
defaultTargets = ["Shop", "Spec", "shop", "vectors"]

# region: libraries
[[require]]
name = "teslavalve"
path = "../../lean"

[[lean_lib]]
name = "Shop"
globs = ["Shop.+"]

[[lean_lib]]
name = "Spec"
globs = ["Spec.+"]
# endregion

# region: shop
[[lean_exe]]
name = "shop"
root = "Main"
needs = ["Shop", "Spec"]
supportInterpreter = true
# endregion

[[lean_exe]]
name = "vectors"
root = "Vectors"
