<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Three streams for one feature. A postcode from the checkout form is checked once and becomes a Postcode; what fails the check goes back to the form. The warehouse's stock already flows through stock_of and is joined, not dug again. The clock gives today's date. All three meet in delivery_date, which gives the checkout a Date.">
