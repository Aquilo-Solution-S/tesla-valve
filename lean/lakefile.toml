name = "teslavalve"
defaultTargets = ["TeslaValve", "Refused", "selftest"]
# `lake test` exercises the refusals and the output commands.
testDriver = "selftest"

# The check and the view. A project requires this package and calls `TeslaValve.run` from a
# program of its own, which names its ledger and its proof libraries.
[[lean_lib]]
name = "TeslaValve"

# One module per refusal of the check. Each builds, and the selftest expects its refusal.
[[lean_lib]]
name = "Refused"
globs = ["Refused.*"]

[[lean_lib]]
name = "Accepted"
globs = ["Accepted.*"]

[[lean_lib]]
name = "FixtureSupport"

# It reads the compiled fixtures, so Lake builds them before it runs.
[[lean_exe]]
name = "selftest"
root = "Selftest"
needs = ["Refused", "Accepted"]
supportInterpreter = true
