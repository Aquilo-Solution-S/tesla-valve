name = "teslavalve"
version = "0.4.0"
defaultTargets = ["TeslaValve", "selftest"]
# `lake test` exercises the refusals and the output commands.
testDriver = "selftest"

# The check and the view. A project requires this package and calls `TeslaValve.run` from a
# program of its own, which names its ledger and its proof libraries.
[[lean_lib]]
name = "TeslaValve"

# The driver reads these compiled fixtures by module name.
[[lean_lib]]
name = "LedgerTests"
globs = ["TeslaValve.Test.Accepted.*", "TeslaValve.Test.Proofs", "TeslaValve.Test.Refused.*"]

[[lean_exe]]
name = "selftest"
root = "TeslaValve.Test.Selftest"
needs = ["LedgerTests"]
supportInterpreter = true
